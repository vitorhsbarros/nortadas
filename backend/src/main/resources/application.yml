server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: nortadas

  # PostgreSQL connection — every value is externalizable via environment
  # variables; the defaults match backend/docker-compose.yml for local dev.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nortadas}
    username: ${POSTGRES_USER:nortadas}
    password: ${POSTGRES_PASSWORD:nortadas} # local-dev default only, override in any real environment

  jpa:
    # Flyway owns the schema; Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Application-specific configuration.
nortadas:
  weather:
    open-meteo:
      # Consumed by the Open-Meteo client adapter (US009). The adapter makes two
      # calls per beach: the forecast API (wind + air temperature) under base-url,
      # and the separate marine API (sea-surface temperature) under marine-base-url.
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}
      marine-base-url: ${OPEN_METEO_MARINE_BASE_URL:https://marine-api.open-meteo.com/v1}
    scheduler:
      # Hourly weather fetch (US009). Cron is [second minute hour ...]; default is
      # the top of every hour. Set enabled=false to switch the trigger off entirely.
      enabled: ${WEATHER_SCHEDULER_ENABLED:true}
      cron: ${WEATHER_SCHEDULER_CRON:0 0 * * * *}
