# Test profile: in-memory H2 in PostgreSQL compatibility mode, so the Spring
# context (including the Flyway migration) can be verified in the build without
# a running PostgreSQL instance. H2 support ships inside flyway-core.
spring:
  datasource:
    url: jdbc:h2:mem:nortadas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Keep the scheduled weather jobs off during tests so the context loads fully
# offline — no scheduled trigger ever reaches out to Open-Meteo or purges rows.
nortadas:
  weather:
    scheduler:
      enabled: false
    retention:
      # Disabled like the fetch scheduler; days is still supplied because the
      # purge use case reads it at construction time, context-load included.
      enabled: false
      days: 7
