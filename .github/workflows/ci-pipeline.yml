name: CI/CD Nortada Pipeline

on:
  pull_request:

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history — the scan below covers every commit, not just this PR's
          # range, so it needs the whole graph.
          fetch-depth: 0

      # Runs the gitleaks OSS CLI directly instead of gitleaks/gitleaks-action@v2,
      # for the same reasons the Semgrep job runs its CLI standalone: full control
      # over the scan mode, a pinned version, and no dependency on GITLEAKS_LICENSE
      # (which the action requires for organization-owned repos — this repo is
      # personal today, but that would become a blocker on transfer).
      #
      # The action was configured with `with: args: detect --source=. --no-git`,
      # which never took effect: v2 has no `args` input, so it was discarded on
      # every run, surfacing only as an "Unexpected input(s) 'args'" annotation on
      # a job that still reported green. What actually ran was a commit-range scan
      # (`--log-opts=--no-merges --first-parent <base>^..<head>`), not the intended
      # working-tree scan. `detect` is also no longer a gitleaks command at all —
      # 8.x splits it into `git` (history) and `dir` (filesystem).
      - name: Install Gitleaks
        env:
          # Pinned rather than "latest" so a new release cannot change the rules
          # under a passing gate, and so the version CI runs is the one changes are
          # tested against locally.
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Scans the entire commit history rather than this PR's range. A secret is
      # leaked the moment it is committed, even if a later commit removes it, and a
      # range scan cannot see anything introduced before the gate existed. The full
      # history takes well under a second at this repo's size, so scanning less
      # buys nothing.
      #
      # --redact keeps discovered secret values out of the logs and the SARIF: this
      # report is uploaded to code scanning, and a gate that publishes the very
      # secret it found would be worse than no gate.
      #
      # continue-on-error plus the enforce step below mirrors the Semgrep job — a
      # non-zero exit on findings would otherwise skip the SARIF upload on exactly
      # the runs where the annotations matter most.
      - name: Scan full git history for secrets
        id: gitleaks
        continue-on-error: true
        run: |
          ./gitleaks git . \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --redact \
            --no-banner

      - name: Upload Gitleaks SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Enforce Gitleaks result
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks found secrets in the repository history — see the Security tab."
          echo "A secret committed at any point is compromised: rotate it first, then remove it."
          exit 1

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Least privilege: this job only needs to read the checked-out source and
    # write SARIF results to GitHub code scanning — nothing else.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      # No SEMGREP_APP_TOKEN — this project has no Semgrep App account, so we run
      # the open-source CLI standalone against public rulesets instead of semgrep ci.
      # --severity ERROR + --error fails the job (blocking gate) only on
      # high/critical-equivalent findings, not every INFO/WARNING hit.
      #
      # p/java was the deliberate low-noise first cut; p/security-audit and
      # p/owasp-top-ten were added after triaging them against the whole backend
      # locally — 81 files scanned, zero findings — so the broader coverage costs
      # no triage backlog.
      #
      # continue-on-error: true is deliberate: --error makes this step exit
      # non-zero on findings, which would otherwise skip the SARIF upload below
      # on exactly the runs where annotations matter most. The real pass/fail
      # verdict is restored by the "Enforce Semgrep result" step at the end,
      # after every SARIF has already been uploaded.
      - name: Run Semgrep SAST scan (backend)
        id: semgrep_backend
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --metrics=off \
            --sarif-output=semgrep-backend.sarif \
            backend/src/main/java backend/src/test/java

      - name: Upload backend SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-backend.sarif
          # Distinct category per scan, otherwise the second upload replaces the
          # first one's results in code scanning instead of sitting alongside it.
          category: semgrep-backend

      # The mobile app (US014, #70) does not exist yet. Gating on mobile/package.json
      # rather than adding the paths unconditionally means this step no-ops cleanly
      # today — semgrep exits non-zero on a missing target path, which would turn
      # the whole gate red — and starts enforcing by itself the moment the Expo
      # project lands, with no workflow edit needed to switch it on.
      - name: Run Semgrep SAST scan (mobile)
        id: semgrep_mobile
        if: hashFiles('mobile/package.json') != ''
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/react \
            --config p/security-audit \
            --severity ERROR \
            --error \
            --metrics=off \
            --sarif-output=semgrep-mobile.sarif \
            mobile

      - name: Upload mobile SARIF to GitHub code scanning
        if: always() && hashFiles('mobile/package.json') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-mobile.sarif
          category: semgrep-mobile

      # Skipped steps report outcome 'skipped', not 'failure', so the mobile check
      # is inert until the app exists.
      - name: Enforce Semgrep result
        if: steps.semgrep_backend.outcome == 'failure' || steps.semgrep_mobile.outcome == 'failure'
        run: |
          echo "Semgrep found ERROR-severity findings — see the Security tab for inline annotations."
          echo "  backend scan: ${{ steps.semgrep_backend.outcome }}"
          echo "  mobile scan:  ${{ steps.semgrep_mobile.outcome }}"
          exit 1

  build-and-test-with-coverage:
    name: Build and Test with Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Verifies gradle-wrapper.jar against Gradle's published checksums. The
      # wrapper is an executable binary committed to the repo, so a tampered one
      # would run arbitrary code on every CI build and every developer machine.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Java 21 matches the toolchain pinned in backend/build.gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # No Docker or PostgreSQL needed: the test profile boots the full Spring
      # context, Flyway migration included, against H2 in PostgreSQL-compatibility
      # mode (backend/src/test/resources/application-test.yml).
      #
      # `build` is the whole gate on its own — it depends on `check`, which
      # backend/build.gradle wires to `jacocoTestCoverageVerification`, so the
      # >=95% line and branch thresholds on com.nortadas.domain* fail the job
      # here rather than needing a separate coverage step.
      - name: Build, test and verify coverage
        run: ./gradlew build --no-daemon --console=plain

      # Uploaded on failure too — a coverage-gate failure is exactly when someone
      # needs the HTML report to see which lines or branches went uncovered.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/build/reports/jacoco/test/
          if-no-files-found: warn

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "SCA Dependency Check - coming in Phase 2"