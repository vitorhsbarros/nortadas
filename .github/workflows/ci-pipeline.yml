name: CI/CD Nortada Pipeline

on:
  pull_request:

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
        with:
          args: detect --source=. --no-git

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Least privilege: this job only needs to read the checked-out source and
    # write SARIF results to GitHub code scanning — nothing else.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      # No SEMGREP_APP_TOKEN — this project has no Semgrep App account, so we run
      # the open-source CLI standalone against a public ruleset instead of semgrep ci.
      # p/java keeps a first cut low-noise; broaden to p/security-audit later once
      # findings are triaged. --severity ERROR + --error fails the job (blocking gate)
      # only on high/critical-equivalent findings, not every INFO/WARNING hit.
      #
      # continue-on-error: true is deliberate: --error makes this step exit
      # non-zero on findings, which would otherwise skip the SARIF upload below
      # on exactly the runs where annotations matter most. The real pass/fail
      # verdict is restored by the "Enforce Semgrep result" step at the end,
      # after the SARIF has already been uploaded.
      - name: Run Semgrep SAST scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/java \
            --severity ERROR \
            --error \
            --metrics=off \
            --sarif-output=semgrep.sarif \
            backend/src/main/java backend/src/test/java

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      - name: Enforce Semgrep result
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep found ERROR-severity findings — see the Security tab for inline annotations."
          exit 1

  build-and-test-with-coverage:
    name: Build and Test with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Build and Test with Coverage Stage - coming in Phase 1"

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "SCA Dependency Check - coming in Phase 2"