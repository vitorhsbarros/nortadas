# Central dependency/plugin version catalog.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format
#
# Spring-managed dependency versions (starters, PostgreSQL driver, Flyway, H2, ...)
# are deliberately NOT listed here: they come from the Spring Boot BOM applied by the
# io.spring.dependency-management plugin in backend/build.gradle.

[versions]
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
